<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#101820">

    <title>MetroCity V5</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101820;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
        }

        button {
            font: inherit;
        }

        /* =====================================================
           GAME
        ===================================================== */

        #game {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            touch-action: none;

            cursor: default;
        }


        /* =====================================================
           TOP HUD
        ===================================================== */

        .topbar {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 72px;

            display: flex;
            align-items: center;

            gap: 12px;

            padding: 10px 14px;

            background:
                rgba(9, 13, 19, 0.90);

            border-bottom:
                1px solid rgba(255,255,255,0.08);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            z-index: 100;
        }


        .logo {
            flex-shrink: 0;

            min-width: 130px;

            color: white;

            font-size: 20px;
            font-weight: 900;

            letter-spacing: .5px;
        }


        .logo span {
            display: block;

            margin-top: 2px;

            color:
                rgba(255,255,255,.42);

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1.5px;
        }


        .stats {
            display: flex;

            align-items: center;

            gap: 8px;

            overflow-x: auto;

            scrollbar-width: none;
        }

        .stats::-webkit-scrollbar {
            display: none;
        }


        .stat {
            flex-shrink: 0;

            min-width: 108px;

            padding: 8px 12px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.055);

            border:
                1px solid rgba(255,255,255,.06);

            color: white;
        }


        .stat small {
            display: block;

            margin-bottom: 3px;

            color:
                rgba(255,255,255,.45);

            font-size: 9px;

            font-weight: 700;
        }


        .stat strong {
            display: block;

            color: white;

            font-size: 14px;

            font-weight: 800;
        }


        /* =====================================================
           TOOL INDICATOR
        ===================================================== */

        .tool-indicator {
            position: fixed;

            top: 84px;
            left: 14px;

            padding: 8px 12px;

            border-radius: 11px;

            background:
                rgba(10,15,22,.88);

            border:
                1px solid rgba(255,255,255,.07);

            color: white;

            font-size: 11px;

            font-weight: 700;

            opacity: 0;

            transform:
                translateY(-8px);

            transition: .2s ease;

            pointer-events: none;

            z-index: 150;
        }


        .tool-indicator.show {
            opacity: 1;

            transform:
                translateY(0);
        }


        /* =====================================================
           NOTIFICATION
        ===================================================== */

        .notification {
            position: fixed;

            top: 84px;
            right: 14px;

            width:
                min(350px, calc(100vw - 28px));

            padding: 14px 16px;

            border-radius: 15px;

            background:
                rgba(10,15,22,.95);

            border:
                1px solid rgba(255,255,255,.08);

            box-shadow:
                0 18px 50px rgba(0,0,0,.30);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            opacity: 0;

            transform:
                translateY(-12px);

            pointer-events: none;

            transition: .25s ease;

            z-index: 400;
        }


        .notification.show {
            opacity: 1;

            transform:
                translateY(0);
        }


        .notification strong {
            display: block;

            margin-bottom: 4px;

            color: white;

            font-size: 14px;
        }


        .notification div {
            color:
                rgba(255,255,255,.62);

            font-size: 12px;

            line-height: 1.45;
        }


        /* =====================================================
           BUILD MENU
        ===================================================== */

        .build-menu {
            position: fixed;

            left: 50%;
            bottom: 84px;

            width:
                min(720px, calc(100vw - 24px));

            padding: 15px;

            background:
                rgba(10,15,22,.96);

            border:
                1px solid rgba(255,255,255,.08);

            border-radius: 20px;

            box-shadow:
                0 22px 65px rgba(0,0,0,.38);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            transform:
                translateX(-50%)
                translateY(25px);

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .25s ease,
                transform .25s ease;

            z-index: 250;
        }


        .build-menu.open {
            opacity: 1;

            pointer-events: auto;

            transform:
                translateX(-50%)
                translateY(0);
        }


        .build-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 12px;
        }


        .build-title {
            color: white;

            font-size: 15px;

            font-weight: 800;
        }


        .build-subtitle {
            margin-top: 3px;

            color:
                rgba(255,255,255,.42);

            font-size: 10px;
        }


        .close-build {
            width: 32px;
            height: 32px;

            border: 0;

            border-radius: 10px;

            background:
                rgba(255,255,255,.07);

            color: white;

            cursor: pointer;
        }


        .build-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 8px;
        }


        .build-item {
            min-height: 76px;

            padding: 8px;

            border:
                1px solid rgba(255,255,255,.06);

            border-radius: 14px;

            background:
                rgba(255,255,255,.055);

            color: white;

            cursor: pointer;

            transition: .15s ease;
        }


        .build-item:hover {
            background:
                rgba(255,255,255,.09);
        }


        .build-item:active {
            transform:
                scale(.95);
        }


        .build-item.selected {
            background:
                rgba(255,255,255,.12);

            border-color:
                rgba(255,255,255,.25);
        }


        .build-item .icon {
            display: block;

            margin-bottom: 5px;

            font-size: 24px;
        }


        .build-item .name {
            display: block;

            font-size: 11px;

            font-weight: 700;
        }


        .build-item .price {
            display: block;

            margin-top: 3px;

            color:
                rgba(255,255,255,.42);

            font-size: 9px;
        }


        /* =====================================================
           BUILDING INFO PANEL
        ===================================================== */

        .building-panel {
            position: fixed;

            top: 90px;
            right: 14px;

            width:
                min(310px, calc(100vw - 28px));

            padding: 16px;

            background:
                rgba(10,15,22,.96);

            border:
                1px solid rgba(255,255,255,.08);

            border-radius: 18px;

            box-shadow:
                0 20px 60px rgba(0,0,0,.35);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            transform:
                translateX(30px);

            opacity: 0;

            pointer-events: none;

            transition: .25s ease;

            z-index: 300;
        }


        .building-panel.open {
            opacity: 1;

            transform:
                translateX(0);

            pointer-events: auto;
        }


        .building-panel-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            padding-bottom: 12px;

            border-bottom:
                1px solid rgba(255,255,255,.07);
        }


        .building-title {
            display: flex;

            align-items: center;

            gap: 9px;
        }


        .building-icon {
            width: 40px;
            height: 40px;

            display: grid;

            place-items: center;

            border-radius: 12px;

            background:
                rgba(255,255,255,.07);

            font-size: 21px;
        }


        .building-title strong {
            display: block;

            color: white;

            font-size: 14px;
        }


        .building-title small {
            display: block;

            margin-top: 2px;

            color:
                rgba(255,255,255,.42);

            font-size: 10px;
        }


        .close-panel {
            width: 30px;
            height: 30px;

            border: 0;

            border-radius: 9px;

            background:
                rgba(255,255,255,.06);

            color: white;

            cursor: pointer;
        }


        .building-level {
            margin-top: 14px;

            padding: 10px 12px;

            border-radius: 11px;

            background:
                rgba(255,255,255,.045);

            color:
                rgba(255,255,255,.68);

            font-size: 11px;
        }


        .building-level strong {
            color: white;
        }


        .building-info-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 7px;

            margin-top: 10px;
        }


        .info-box {
            padding: 9px;

            border-radius: 11px;

            background:
                rgba(255,255,255,.045);
        }


        .info-box small {
            display: block;

            color:
                rgba(255,255,255,.38);

            font-size: 8px;

            font-weight: 700;
        }


        .info-box strong {
            display: block;

            margin-top: 3px;

            color: white;

            font-size: 12px;
        }


        .panel-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;

            margin-top: 13px;
        }


        .panel-btn {
            height: 42px;

            border: 0;

            border-radius: 11px;

            background:
                rgba(255,255,255,.08);

            color: white;

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;
        }


        .panel-btn:active {
            transform:
                scale(.97);
        }


        .panel-btn.danger {
            background:
                rgba(160,70,70,.20);

            color:
                #ffaaaa;
        }


        /* =====================================================
           CAMERA
        ===================================================== */

        .camera-controls {
            position: fixed;

            right: 14px;
            bottom: 88px;

            display: flex;

            flex-direction: column;

            gap: 7px;

            z-index: 120;
        }


        .camera-btn {
            width: 44px;
            height: 44px;

            border:
                1px solid rgba(255,255,255,.08);

            border-radius: 12px;

            background:
                rgba(10,14,20,.86);

            color: white;

            font-size: 19px;

            cursor: pointer;

            backdrop-filter:
                blur(10px);
        }


        .camera-btn:active {
            transform:
                scale(.94);
        }


        /* =====================================================
           SPEED
        ===================================================== */

        .speed-control {
            position: fixed;

            left: 14px;
            bottom: 88px;

            display: flex;

            align-items: center;

            gap: 5px;

            padding: 5px;

            background:
                rgba(10,14,20,.86);

            border:
                1px solid rgba(255,255,255,.07);

            border-radius: 13px;

            z-index: 120;
        }


        .speed-btn {
            min-width: 38px;

            height: 34px;

            border: 0;

            border-radius: 9px;

            background: transparent;

            color:
                rgba(255,255,255,.55);

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;
        }


        .speed-btn.active {
            background:
                rgba(255,255,255,.10);

            color: white;
        }


        /* =====================================================
           TOOLBAR
        ===================================================== */

        .toolbar {
            position: fixed;

            left: 50%;
            bottom: 10px;

            transform:
                translateX(-50%);

            width:
                min(760px, calc(100vw - 20px));

            height: 62px;

            display: flex;

            align-items: center;

            justify-content: space-around;

            padding: 6px;

            background:
                rgba(9,13,19,.95);

            border:
                1px solid rgba(255,255,255,.08);

            border-radius: 18px;

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            z-index: 100;
        }


        .tool {
            width: 60px;
            height: 50px;

            border: 0;

            border-radius: 13px;

            background: transparent;

            color: white;

            cursor: pointer;

            transition: .15s ease;
        }


        .tool:hover {
            background:
                rgba(255,255,255,.06);
        }


        .tool:active {
            transform:
                scale(.94);
        }


        .tool.active {
            background:
                rgba(255,255,255,.10);
        }


        .tool-icon {
            display: block;

            margin-bottom: 3px;

            font-size: 20px;
        }


        .tool-label {
            display: block;

            color:
                rgba(255,255,255,.52);

            font-size: 8px;

            font-weight: 700;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .topbar {
                height: 64px;

                padding:
                    8px 10px;
            }


            .logo {
                min-width: 92px;

                font-size: 16px;
            }


            .logo span {
                font-size: 7px;
            }


            .stat {
                min-width: 88px;

                padding:
                    7px 9px;
            }


            .stat small {
                font-size: 8px;
            }


            .stat strong {
                font-size: 12px;
            }


            .build-menu {
                bottom: 78px;

                padding: 12px;
            }


            .build-grid {
                grid-template-columns:
                    repeat(4, 1fr);

                gap: 6px;
            }


            .build-item {
                min-height: 65px;

                padding: 6px;
            }


            .build-item .icon {
                font-size: 20px;
            }


            .build-item .name {
                font-size: 9px;
            }


            .build-item .price {
                display: none;
            }


            .building-panel {
                top: auto;

                right: 8px;
                left: 8px;

                bottom: 75px;

                width: auto;

                transform:
                    translateY(25px);
            }


            .building-panel.open {
                transform:
                    translateY(0);
            }


            .camera-controls {
                right: 9px;

                bottom: 75px;
            }


            .camera-btn {
                width: 40px;
                height: 40px;
            }


            .speed-control {
                left: 9px;

                bottom: 75px;
            }


            .speed-btn {
                min-width: 34px;
            }


            .toolbar {
                width:
                    calc(100vw - 12px);

                bottom: 6px;

                height: 58px;
            }


            .tool {
                width: 50px;
            }


            .notification {
                top: 72px;

                right: 9px;

                width:
                    calc(100vw - 18px);
            }
        }

    </style>
</head>


<body>

    <!-- =====================================================
         GAME CANVAS
    ====================================================== -->

    <canvas id="game"></canvas>


    <!-- =====================================================
         TOP HUD
    ====================================================== -->

    <header class="topbar">

        <div class="logo">

            METROCITY

            <span>
                CITY SIMULATOR • V5
            </span>

        </div>


        <div class="stats">

            <div class="stat">
                <small>💰 MONEY</small>
                <strong id="money">
                    $125,000
                </strong>
            </div>


            <div class="stat">
                <small>👥 POPULATION</small>
                <strong id="population">
                    1,250
                </strong>
            </div>


            <div class="stat">
                <small>😊 HAPPINESS</small>
                <strong id="happiness">
                    82%
                </strong>
            </div>


            <div class="stat">
                <small>⚡ POWER</small>
                <strong id="power">
                    100%
                </strong>
            </div>

        </div>

    </header>


    <!-- =====================================================
         TOOL INDICATOR
    ====================================================== -->

    <div
        id="toolIndicator"
        class="tool-indicator"
    >
        Tool: Select
    </div>


    <!-- =====================================================
         NOTIFICATION
    ====================================================== -->

    <div
        id="notification"
        class="notification"
    >

        <strong id="notificationTitle">
            MetroCity
        </strong>

        <div id="notificationText">
            Welcome to your city.
        </div>

    </div>


    <!-- =====================================================
         BUILD MENU
    ====================================================== -->

    <section
        id="buildMenu"
        class="build-menu"
    >

        <div class="build-header">

            <div>

                <div class="build-title">
                    Construction
                </div>

                <div class="build-subtitle">
                    Choose what you want to build
                </div>

            </div>


            <button
                id="closeBuild"
                class="close-build"
            >
                ✕
            </button>

        </div>


        <div class="build-grid">

            <button
                class="build-item"
                data-tool="road"
            >

                <span class="icon">
                    🛣️
                </span>

                <span class="name">
                    Road
                </span>

                <span class="price">
                    $20/m
                </span>

            </button>


            <button
                class="build-item"
                data-tool="house"
            >

                <span class="icon">
                    🏠
                </span>

                <span class="name">
                    Residential
                </span>

                <span class="price">
                    $100
                </span>

            </button>


            <button
                class="build-item"
                data-tool="commercial"
            >

                <span class="icon">
                    🏢
                </span>

                <span class="name">
                    Commercial
                </span>

                <span class="price">
                    $250
                </span>

            </button>


            <button
                class="build-item"
                data-tool="industrial"
            >

                <span class="icon">
                    🏭
                </span>

                <span class="name">
                    Industrial
                </span>

                <span class="price">
                    $350
                </span>

            </button>


            <button
                class="build-item"
                data-tool="hospital"
            >

                <span class="icon">
                    🏥
                </span>

                <span class="name">
                    Hospital
                </span>

                <span class="price">
                    $5,000
                </span>

            </button>


            <button
                class="build-item"
                data-tool="police"
            >

                <span class="icon">
                    🚓
                </span>

                <span class="name">
                    Police
                </span>

                <span class="price">
                    $3,500
                </span>

            </button>


            <button
                class="build-item"
                data-tool="fire"
            >

                <span class="icon">
                    🚒
                </span>

                <span class="name">
                    Fire
                </span>

                <span class="price">
                    $3,000
                </span>

            </button>


            <button
                class="build-item"
                data-tool="school"
            >

                <span class="icon">
                    🏫
                </span>

                <span class="name">
                    School
                </span>

                <span class="price">
                    $4,000
                </span>

            </button>


            <button
                class="build-item"
                data-tool="park"
            >

                <span class="icon">
                    🌳
                </span>

                <span class="name">
                    Park
                </span>

                <span class="price">
                    $500
                </span>

            </button>


            <button
                class="build-item"
                data-tool="power"
            >

                <span class="icon">
                    ⚡
                </span>

                <span class="name">
                    Power
                </span>

                <span class="price">
                    $2,000
                </span>

            </button>


            <button
                class="build-item"
                data-tool="water"
            >

                <span class="icon">
                    💧
                </span>

                <span class="name">
                    Water
                </span>

                <span class="price">
                    $1,500
                </span>

            </button>


            <button
                class="build-item"
                data-tool="stadium"
            >

                <span class="icon">
                    🏟️
                </span>

                <span class="name">
                    Stadium
                </span>

                <span class="price">
                    $12,000
                </span>

            </button>

        </div>

    </section>


    <!-- =====================================================
         BUILDING PANEL
    ====================================================== -->

    <section
        id="buildingPanel"
        class="building-panel"
    >

        <div class="building-panel-header">

            <div class="building-title">

                <div
                    id="buildingIcon"
                    class="building-icon"
                >
                    🏠
                </div>


                <div>

                    <strong id="buildingName">
                        Residential
                    </strong>

                    <small id="buildingType">
                        Building
                    </small>

                </div>

            </div>


            <button
                id="closePanel"
                class="close-panel"
            >
                ✕
            </button>

        </div>


        <div
            id="buildingLevel"
            class="building-level"
        >
            Level
            <strong>
                1
            </strong>
        </div>


        <div class="building-info-grid">

            <div class="info-box">

                <small>
                    POPULATION
                </small>

                <strong id="panelPopulation">
                    0
                </strong>

            </div>


            <div class="info-box">

                <small>
                    WORKERS
                </small>

                <strong id="panelWorkers">
                    0
                </strong>

            </div>


            <div class="info-box">

                <small>
                    HAPPINESS
                </small>

                <strong id="panelHappiness">
                    +0
                </strong>

            </div>


            <div class="info-box">

                <small>
                    SERVICE
                </small>

                <strong id="panelService">
                    0
                </strong>

            </div>

        </div>


        <div class="panel-actions">

            <button
                id="upgradeBuilding"
                class="panel-btn"
            >
                ⬆ Upgrade
            </button>


            <button
                id="demolishBuilding"
                class="panel-btn danger"
            >
                🗑 Demolish
            </button>

        </div>

    </section>


    <!-- =====================================================
         CAMERA CONTROLS
    ====================================================== -->

    <div class="camera-controls">

        <button
            id="zoomIn"
            class="camera-btn"
        >
            +
        </button>


        <button
            id="resetCamera"
            class="camera-btn"
        >
            ◎
        </button>


        <button
            id="zoomOut"
            class="camera-btn"
        >
            −
        </button>

    </div>


    <!-- =====================================================
         SPEED
    ====================================================== -->

    <div class="speed-control">

        <button
            class="speed-btn active"
            data-speed="1"
        >
            1×
        </button>


        <button
            class="speed-btn"
            data-speed="2"
        >
            2×
        </button>


        <button
            class="speed-btn"
            data-speed="4"
        >
            4×
        </button>


        <button
            class="speed-btn"
            data-speed="8"
        >
            8×
        </button>

    </div>


    <!-- =====================================================
         BOTTOM TOOLBAR
    ====================================================== -->

    <nav class="toolbar">

        <button
            class="tool active"
            id="buildButton"
        >

            <span class="tool-icon">
                🏗️
            </span>

            <span class="tool-label">
                BUILD
            </span>

        </button>


        <button
            class="tool"
            id="mapButton"
        >

            <span class="tool-icon">
                🗺️
            </span>

            <span class="tool-label">
                MAP
            </span>

        </button>


        <button
            class="tool"
            id="cityButton"
        >

            <span class="tool-icon">
                🏙️
            </span>

            <span class="tool-label">
                CITY
            </span>

        </button>


        <button
            class="tool"
            id="statsButton"
        >

            <span class="tool-icon">
                📊
            </span>

            <span class="tool-label">
                STATS
            </span>

        </button>


        <button
            class="tool"
            id="settingsButton"
        >

            <span class="tool-icon">
                ⚙️
            </span>

            <span class="tool-label">
                SETTINGS
            </span>

        </button>

    </nav>


    <!-- =====================================================
         GAME ENGINE
    ====================================================== -->

    <script type="module">

        import {
            RoadEngine
        } from "./RoadEngine.js";


        import {
            BuildingEngine
        } from "./BuildingEngine.js";


        /* =====================================================
           CANVAS
        ===================================================== */

        const canvas =
            document.getElementById("game");

        const ctx =
            canvas.getContext("2d");


        let width =
            window.innerWidth;

        let height =
            window.innerHeight;


        function resizeCanvas() {

            width =
                window.innerWidth;

            height =
                window.innerHeight;


            const dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );


            canvas.width =
                width * dpr;

            canvas.height =
                height * dpr;


            canvas.style.width =
                width + "px";

            canvas.style.height =
                height + "px";


            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );
        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        resizeCanvas();


        /* =====================================================
           CITY
        ===================================================== */

        const city = {

            money: 125000,

            population: 1250,

            happiness: 82,

            power: 100,

            currentTool: null,

            roads: [],

            buildings: [],

            intersections: []

        };


        /* =====================================================
           CAMERA
        ===================================================== */

        const camera = {

            x: 0,

            y: 0,

            zoom: 1,

            targetZoom: 1,

            minZoom: .45,

            maxZoom: 3

        };


        /* =====================================================
           WORLD
        ===================================================== */

        const world = {

            size: 2400

        };


        /* =====================================================
           ENGINES
        ===================================================== */

        const roadEngine =
            new RoadEngine(
                canvas,
                city,
                camera
            );


        const buildingEngine =
            new BuildingEngine(
                city,
                camera,
                canvas
            );


        /* =====================================================
           BUILD MENU
        ===================================================== */

        const buildMenu =
            document.getElementById(
                "buildMenu"
            );


        document
            .getElementById("buildButton")
            .addEventListener(
                "click",
                () => {

                    buildMenu.classList.toggle(
                        "open"
                    );

                }
            );


        document
            .getElementById("closeBuild")
            .addEventListener(
                "click",
                () => {

                    buildMenu.classList.remove(
                        "open"
                    );

                }
            );


        /* =====================================================
           BUILD TOOL SELECT
        ===================================================== */

        document
            .querySelectorAll(".build-item")
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            const tool =
                                button.dataset.tool;


                            city.currentTool =
                                tool;


                            document
                                .querySelectorAll(
                                    ".build-item"
                                )
                                .forEach(
                                    item => {

                                        item.classList
                                            .remove(
                                                "selected"
                                            );

                                    }
                                );


                            button.classList.add(
                                "selected"
                            );


                            buildMenu.classList.remove(
                                "open"
                            );


                            updateToolIndicator(
                                tool
                            );

                        }
                    );

                }
            );


        /* =====================================================
           TOOL INDICATOR
        ===================================================== */

        function updateToolIndicator(
            tool
        ) {

            const indicator =
                document.getElementById(
                    "toolIndicator"
                );


            if (!tool) {

                indicator.classList.remove(
                    "show"
                );

                return;
            }


            indicator.textContent =
                "Tool: " +
                formatToolName(
                    tool
                );


            indicator.classList.add(
                "show"
            );
        }


        function formatToolName(
            tool
        ) {

            return tool
                .charAt(0)
                .toUpperCase()
                +
                tool
                    .slice(1)
                    .replace(
                        /_/g,
                        " "
                    );
        }


        /* =====================================================
           CAMERA
        ===================================================== */

        document
            .getElementById("zoomIn")
            .addEventListener(
                "click",
                () => {

                    camera.targetZoom =
                        Math.min(
                            camera.targetZoom *
                            1.25,

                            camera.maxZoom
                        );

                }
            );


        document
            .getElementById("zoomOut")
            .addEventListener(
                "click",
                () => {

                    camera.targetZoom =
                        Math.max(
                            camera.targetZoom /
                            1.25,

                            camera.minZoom
                        );

                }
            );


        document
            .getElementById("resetCamera")
            .addEventListener(
                "click",
                () => {

                    camera.x = 0;

                    camera.y = 0;

                    camera.targetZoom = 1;

                }
            );


        /* =====================================================
           CAMERA DRAG
        ===================================================== */

        let cameraPointer = null;


        canvas.addEventListener(
            "pointerdown",
            event => {

                if (
                    city.currentTool ===
                    "road"
                ) {

                    return;
                }


                if (
                    city.currentTool
                ) {

                    return;
                }


                cameraPointer = {

                    id:
                        event.pointerId,

                    x:
                        event.clientX,

                    y:
                        event.clientY

                };


                canvas.setPointerCapture(
                    event.pointerId
                );

            }
        );


        canvas.addEventListener(
            "pointermove",
            event => {

                if (!cameraPointer)
                    return;


                if (
                    event.pointerId !==
                    cameraPointer.id
                ) {

                    return;
                }


                const dx =
                    event.clientX -
                    cameraPointer.x;


                const dy =
                    event.clientY -
                    cameraPointer.y;


                camera.x += dx;

                camera.y += dy;


                cameraPointer.x =
                    event.clientX;

                cameraPointer.y =
                    event.clientY;

            }
        );


        function stopCameraDrag() {

            cameraPointer = null;

        }


        canvas.addEventListener(
            "pointerup",
            stopCameraDrag
        );


        canvas.addEventListener(
            "pointercancel",
            stopCameraDrag
        );


        /* =====================================================
           BUILDING SELECT
        ===================================================== */

        canvas.addEventListener(
            "click",
            event => {

                if (
                    city.currentTool
                ) {

                    return;
                }


                const rect =
                    canvas.getBoundingClientRect();


                const screenX =
                    event.clientX -
                    rect.left;


                const screenY =
                    event.clientY -
                    rect.top;


                const worldPoint =
                    screenToWorld(
                        screenX,
                        screenY
                    );


                const building =
                    buildingEngine.findBuildingAt(
                        worldPoint.x,
                        worldPoint.y
                    );


                if (building) {

                    buildingEngine.selectBuilding(
                        building
                    );

                    openBuildingPanel(
                        building
                    );

                }

            }
        );


        function screenToWorld(
            screenX,
            screenY
        ) {

            return {

                x:
                    (
                        screenX -
                        width / 2 -
                        camera.x
                    ) /
                    camera.zoom,

                y:
                    (
                        screenY -
                        height / 2 -
                        camera.y
                    ) /
                    camera.zoom

            };
        }


        /* =====================================================
           BUILDING PANEL
        ===================================================== */

        let selectedBuilding = null;


        function openBuildingPanel(
            building
        ) {

            selectedBuilding =
                building;


            const data =
                BuildingEngine.TYPES[
                    building.type
                ];


            if (!data)
                return;


            document.getElementById(
                "buildingIcon"
            ).textContent =
                data.icon;


            document.getElementById(
                "buildingName"
            ).textContent =
                data.name;


            document.getElementById(
                "buildingType"
            ).textContent =
                "City Infrastructure";


            document.getElementById(
                "buildingLevel"
            ).innerHTML =
                `Level <strong>${building.level}</strong>`;


            document.getElementById(
                "panelPopulation"
            ).textContent =
                Number(
                    building.population || 0
                ).toLocaleString();


            document.getElementById(
                "panelWorkers"
            ).textContent =
                Number(
                    building.workers || 0
                ).toLocaleString();


            const happiness =
                building.happiness || 0;


            document.getElementById(
                "panelHappiness"
            ).textContent =
                happiness >= 0
                    ? "+" + happiness
                    : happiness;


            const service =
                buildingEngine.getServiceCoverage(
                    building
                );


            document.getElementById(
                "panelService"
            ).textContent =
                service > 0
                    ? service.toLocaleString()
                    : "—";


            document
                .getElementById(
                    "buildingPanel"
                )
                .classList.add(
                    "open"
                );
        }


        document
            .getElementById("closePanel")
            .addEventListener(
                "click",
                () => {

                    closeBuildingPanel();

                }
            );


        function closeBuildingPanel() {

            selectedBuilding = null;

            buildingEngine.selectedBuilding =
                null;


            document
                .getElementById(
                    "buildingPanel"
                )
                .classList.remove(
                    "open"
                );
        }


        /* =====================================================
           UPGRADE
        ===================================================== */

        document
            .getElementById(
                "upgradeBuilding"
            )
            .addEventListener(
                "click",
                () => {

                    if (
                        !selectedBuilding
                    ) {

                        return;
                    }


                    const success =
                        buildingEngine.upgradeBuilding(
                            selectedBuilding
                        );


                    if (success) {

                        updateHUD();

                        openBuildingPanel(
                            selectedBuilding
                        );

                    }

                }
            );


        /* =====================================================
           DEMOLISH
        ===================================================== */

        document
            .getElementById(
                "demolishBuilding"
            )
            .addEventListener(
                "click",
                () => {

                    if (
                        !selectedBuilding
                    ) {

                        return;
                    }


                    const confirmed =
                        window.confirm(
                            "Demolish this building?"
                        );


                    if (!confirmed)
                        return;


                    buildingEngine.demolishBuilding(
                        selectedBuilding
                    );


                    closeBuildingPanel();

                    updateHUD();

                }
            );


        /* =====================================================
           HUD
        ===================================================== */

        function updateHUD() {

            document.getElementById(
                "money"
            ).textContent =
                "$" +
                Math.max(
                    0,
                    Math.floor(
                        city.money
                    )
                ).toLocaleString();


            document.getElementById(
                "population"
            ).textContent =
                Math.floor(
                    city.population
                ).toLocaleString();


            document.getElementById(
                "happiness"
            ).textContent =
                Math.round(
                    city.happiness
                ) +
                "%";


            document.getElementById(
                "power"
            ).textContent =
                Math.round(
                    city.power
                ) +
                "%";

        }


        /* =====================================================
           NOTIFICATION
        ===================================================== */

        let notificationTimer = null;


        function showNotification(
            title,
            text
        ) {

            const box =
                document.getElementById(
                    "notification"
                );


            document.getElementById(
                "notificationTitle"
            ).textContent =
                title;


            document.getElementById(
                "notificationText"
            ).textContent =
                text;


            box.classList.add(
                "show"
            );


            clearTimeout(
                notificationTimer
            );


            notificationTimer =
                setTimeout(
                    () => {

                        box.classList.remove(
                            "show"
                        );

                    },
                    2800
                );
        }


        /* =====================================================
           ENGINE NOTIFICATIONS
        ===================================================== */

        window.addEventListener(
            "metrocity:notification",
            event => {

                const detail =
                    event.detail || {};


                showNotification(
                    detail.title ||
                        "MetroCity",

                    detail.text ||
                        ""
                );

            }
        );


        /* =====================================================
           BUILDING EVENTS
        ===================================================== */

        window.addEventListener(
            "metrocity:buildingCreated",
            () => {

                updateHUD();

            }
        );


        window.addEventListener(
            "metrocity:buildingUpgraded",
            event => {

                updateHUD();


                if (
                    selectedBuilding &&
                    event.detail &&
                    event.detail.id ===
                        selectedBuilding.id
                ) {

                    openBuildingPanel(
                        selectedBuilding
                    );

                }

            }
        );


        window.addEventListener(
            "metrocity:buildingDemolished",
            () => {

                updateHUD();

            }
        );


        window.addEventListener(
            "metrocity:roadCreated",
            () => {

                updateHUD();

            }
        );


        /* =====================================================
           SPEED
        ===================================================== */

        document
            .querySelectorAll(
                ".speed-btn"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            document
                                .querySelectorAll(
                                    ".speed-btn"
                                )
                                .forEach(
                                    item => {

                                        item.classList
                                            .remove(
                                                "active"
                                            );

                                    }
                                );


                            button.classList.add(
                                "active"
                            );


                            window.metroCitySpeed =
                                Number(
                                    button.dataset.speed
                                );


                            showNotification(
                                "Simulation Speed",
                                `${button.dataset.speed}× speed enabled.`
                            );

                        }
                    );

                }
            );


        window.metroCitySpeed = 1;


        /* =====================================================
           OTHER BUTTONS
        ===================================================== */

        document
            .getElementById("mapButton")
            .addEventListener(
                "click",
                () => {

                    showNotification(
                        "Map",
                        "Map management is ready for the next module."
                    );

                }
            );


        document
            .getElementById("cityButton")
            .addEventListener(
                "click",
                () => {

                    showNotification(
                        "City Overview",
                        `${city.buildings.length} buildings • ${city.roads.length} roads`
                    );

                }
            );


        document
            .getElementById("statsButton")
            .addEventListener(
                "click",
                () => {

                    showNotification(
                        "City Statistics",
                        `Population: ${city.population.toLocaleString()}`
                    );

                }
            );


        document
            .getElementById("settingsButton")
            .addEventListener(
                "click",
                () => {

                    showNotification(
                        "Settings",
                        "Advanced settings module coming next."
                    );

                }
            );


        /* =====================================================
           DRAW GROUND
        ===================================================== */

        function drawGround() {

            ctx.fillStyle =
                "#293c2f";


            ctx.fillRect(
                -world.size / 2,
                -world.size / 2,
                world.size,
                world.size
            );

        }


        /* =====================================================
           DRAW GRID
        ===================================================== */

        function drawGrid() {

            const gridSize = 100;

            const range = 1200;


            ctx.strokeStyle =
                "rgba(255,255,255,.035)";

            ctx.lineWidth = 1;


            for (
                let x = -range;
                x <= range;
                x += gridSize
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    x,
                    -range
                );

                ctx.lineTo(
                    x,
                    range
                );

                ctx.stroke();

            }


            for (
                let y = -range;
                y <= range;
                y += gridSize
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    -range,
                    y
                );

                ctx.lineTo(
                    range,
                    y
                );

                ctx.stroke();

            }

        }


        /* =====================================================
           DRAW ROADS
        ===================================================== */

        function drawRoads() {

            ctx.lineCap =
                "round";

            ctx.lineJoin =
                "round";


            for (
                const road
                of city.roads
            ) {

                ctx.strokeStyle =
                    "#15191d";

                ctx.lineWidth =
                    38;


                ctx.beginPath();

                ctx.moveTo(
                    road.x1,
                    road.y1
                );

                ctx.lineTo(
                    road.x2,
                    road.y2
                );

                ctx.stroke();


                ctx.strokeStyle =
                    "#535960";

                ctx.lineWidth =
                    28;


                ctx.beginPath();

                ctx.moveTo(
                    road.x1,
                    road.y1
                );

                ctx.lineTo(
                    road.x2,
                    road.y2
                );

                ctx.stroke();


                ctx.strokeStyle =
                    "rgba(255,255,255,.50)";

                ctx.lineWidth = 2;

                ctx.setLineDash([
                    10,
                    10
                ]);


                ctx.beginPath();

                ctx.moveTo(
                    road.x1,
                    road.y1
                );

                ctx.lineTo(
                    road.x2,
                    road.y2
                );

                ctx.stroke();


                ctx.setLineDash([]);

            }


            for (
                const intersection
                of city.intersections || []
            ) {

                ctx.fillStyle =
                    "#666c72";


                ctx.beginPath();

                ctx.arc(
                    intersection.x,
                    intersection.y,
                    15,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }

        }


        /* =====================================================
           DRAW BUILDINGS
        ===================================================== */

        function drawBuildings() {

            for (
                const building
                of city.buildings
            ) {

                const data =
                    BuildingEngine.TYPES[
                        building.type
                    ];


                if (!data)
                    continue;


                ctx.save();


                ctx.translate(
                    building.x,
                    building.y
                );


                /*
                 * Shadow
                 */

                ctx.fillStyle =
                    "rgba(0,0,0,.25)";


                ctx.fillRect(

                    -building.size / 2 + 6,

                    -building.size / 2 + 7,

                    building.size,

                    building.size

                );


                /*
                 * Building
                 */

                ctx.fillStyle =
                    data.color;


                ctx.fillRect(

                    -building.size / 2,

                    -building.size / 2,

                    building.size,

                    building.size

                );


                /*
                 * Roof
                 */

                ctx.fillStyle =
                    "rgba(0,0,0,.20)";


                ctx.fillRect(

                    -building.size / 2,

                    -building.size / 2,

                    building.size,

                    7

                );


                /*
                 * Windows
                 */

                if (
                    building.type !==
                    "park"
                ) {

                    ctx.fillStyle =
                        "rgba(255,255,255,.38)";


                    const spacing = 12;

                    const windowSize = 4;


                    for (
                        let wx =
                            -building.size / 2 + 9;

                        wx <
                            building.size / 2 - 4;

                        wx += spacing
                    ) {

                        for (
                            let wy =
                                -building.size / 2 + 15;

                            wy <
                                building.size / 2 - 4;

                            wy += spacing
                        ) {

                            ctx.fillRect(
                                wx,
                                wy,
                                windowSize,
                                windowSize
                            );

                        }

                    }

                }


                /*
                 * Park trees
                 */

                if (
                    building.type ===
                    "park"
                ) {

                    ctx.fillStyle =
                        "#78925d";


                    for (
                        let i = 0;
                        i < 5;
                        i++
                    ) {

                        const angle =
                            (
                                i / 5
                            ) *
                            Math.PI *
                            2;


                        const radius =
                            building.size *
                            .24;


                        ctx.beginPath();

                        ctx.arc(

                            Math.cos(angle) *
                                radius,

                            Math.sin(angle) *
                                radius,

                            5,

                            0,
                            Math.PI * 2

                        );

                        ctx.fill();

                    }

                }


                /*
                 * Building icon
                 */

                ctx.textAlign =
                    "center";

                ctx.textBaseline =
                    "middle";

                ctx.font =
                    `${Math.max(
                        14,
                        building.size * .30
                    )}px Arial`;


                ctx.fillText(
                    data.icon,
                    0,
                    0
                );


                /*
                 * Level
                 */

                if (
                    building.level > 1
                ) {

                    ctx.fillStyle =
                        "rgba(10,10,10,.75)";


                    ctx.beginPath();

                    ctx.roundRect(
                        building.size / 2 - 19,
                        -building.size / 2 - 8,
                        28,
                        15,
                        5
                    );

                    ctx.fill();


                    ctx.fillStyle =
                        "white";


                    ctx.font =
                        "bold 8px Arial";


                    ctx.fillText(
                        "LV " +
                        building.level,

                        building.size / 2 - 5,

                        -building.size / 2
                    );

                }


                ctx.restore();

            }

        }


        /* =====================================================
           DRAW LOOP
        ===================================================== */

        function draw() {

            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            ctx.fillStyle =
                "#101820";


            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            ctx.save();


            ctx.translate(
                width / 2 +
                camera.x,

                height / 2 +
                camera.y
            );


            ctx.scale(
                camera.zoom,
                camera.zoom
            );


            drawGround();

            drawGrid();

            drawRoads();

            drawBuildings();


            /*
             * Building preview
             */

            buildingEngine.drawPreview(
                ctx
            );


            /*
             * Road preview
             */

            if (
                roadEngine &&
                typeof roadEngine.drawPreview ===
                    "function"
            ) {

                roadEngine.drawPreview(
                    ctx
                );

            }


            /*
             * Selected building
             */

            if (
                buildingEngine.selectedBuilding
            ) {

                const building =
                    buildingEngine.selectedBuilding;


                ctx.save();


                ctx.strokeStyle =
                    "rgba(255,255,255,.95)";


                ctx.lineWidth = 2;


                ctx.setLineDash([
                    6,
                    5
                ]);


                ctx.strokeRect(

                    building.x -
                        building.size / 2 -
                        6,

                    building.y -
                        building.size / 2 -
                        6,

                    building.size + 12,

                    building.size + 12

                );


                ctx.setLineDash([]);


                ctx.restore();

            }


            ctx.restore();


            /*
             * Smooth zoom
             */

            camera.zoom +=
                (
                    camera.targetZoom -
                    camera.zoom
                ) *
                .12;


            requestAnimationFrame(
                draw
            );

        }


        /* =====================================================
           INITIALIZE
        ===================================================== */

        updateHUD();


        showNotification(
            "Welcome to MetroCity",
            "Tap BUILD to start creating your city."
        );


        draw();

    </script>

</body>
</html>
