<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#101820"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>MetroCity V5</title>

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101820;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        body {
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none;
        }

        button {
            font: inherit;
            border: 0;
            outline: 0;
        }

        button:focus-visible {
            outline: 2px solid rgba(255,255,255,.55);
            outline-offset: 2px;
        }

        /* =========================================================
           GAME CANVAS
        ========================================================= */

        #game {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            background: #101820;

            touch-action: none;

            cursor: default;

            z-index: 1;
        }

        /* =========================================================
           TOP HUD
        ========================================================= */

        .topbar {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 74px;

            display: flex;
            align-items: center;

            gap: 12px;

            padding:
                max(10px, env(safe-area-inset-top))
                14px
                10px
                14px;

            background:
                rgba(7, 11, 16, .92);

            border-bottom:
                1px solid rgba(255,255,255,.08);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            z-index: 100;
        }

        .logo {
            flex: 0 0 auto;

            min-width: 145px;

            color: #fff;

            font-size: 21px;
            line-height: 1;

            font-weight: 950;

            letter-spacing: .8px;
        }

        .logo span {
            display: block;

            margin-top: 7px;

            color:
                rgba(255,255,255,.40);

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 2.2px;
        }

        .stats {
            min-width: 0;

            display: flex;
            align-items: center;

            gap: 8px;

            overflow-x: auto;
            overflow-y: hidden;

            scrollbar-width: none;

            padding-right: 2px;
        }

        .stats::-webkit-scrollbar {
            display: none;
        }

        .stat {
            flex: 0 0 auto;

            min-width: 112px;

            padding:
                9px 13px;

            border-radius: 15px;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,.065),
                    rgba(255,255,255,.035)
                );

            border:
                1px solid rgba(255,255,255,.075);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.035);

            color: #fff;
        }

        .stat small {
            display: block;

            margin-bottom: 4px;

            color:
                rgba(255,255,255,.44);

            font-size: 10px;

            line-height: 1;

            font-weight: 800;

            letter-spacing: .6px;
        }

        .stat strong {
            display: block;

            color: #fff;

            font-size: 15px;

            line-height: 1.1;

            font-weight: 900;

            white-space: nowrap;
        }

        /* =========================================================
           TOOL INDICATOR
        ========================================================= */

        .tool-indicator {
            position: fixed;

            top: 88px;
            left: 14px;

            padding:
                9px 13px;

            border-radius: 12px;

            background:
                rgba(8,13,19,.94);

            border:
                1px solid rgba(255,255,255,.08);

            box-shadow:
                0 12px 35px rgba(0,0,0,.25);

            color: #fff;

            font-size: 11px;
            font-weight: 800;

            opacity: 0;

            transform:
                translateY(-8px);

            pointer-events: none;

            transition:
                opacity .2s ease,
                transform .2s ease;

            z-index: 150;
        }

        .tool-indicator.show {
            opacity: 1;

            transform:
                translateY(0);
        }

        /* =========================================================
           NOTIFICATION
        ========================================================= */

        .notification {
            position: fixed;

            top: 88px;
            right: 14px;

            width:
                min(360px, calc(100vw - 28px));

            padding:
                15px 16px;

            border-radius: 16px;

            background:
                rgba(8,13,19,.96);

            border:
                1px solid rgba(255,255,255,.09);

            box-shadow:
                0 20px 60px rgba(0,0,0,.35);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            opacity: 0;

            transform:
                translateY(-12px);

            pointer-events: none;

            transition:
                opacity .25s ease,
                transform .25s ease;

            z-index: 500;
        }

        .notification.show {
            opacity: 1;

            transform:
                translateY(0);
        }

        .notification strong {
            display: block;

            margin-bottom: 5px;

            color: #fff;

            font-size: 14px;

            font-weight: 900;
        }

        .notification div {
            color:
                rgba(255,255,255,.60);

            font-size: 12px;

            line-height: 1.45;
        }

        /* =========================================================
           BUILD MENU
        ========================================================= */

        .build-menu {
            position: fixed;

            left: 50%;
            bottom: 86px;

            width:
                min(760px, calc(100vw - 24px));

            padding: 15px;

            background:
                rgba(7,12,18,.97);

            border:
                1px solid rgba(255,255,255,.09);

            border-radius: 20px;

            box-shadow:
                0 25px 80px rgba(0,0,0,.42);

            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);

            opacity: 0;
            visibility: hidden;

            transform:
                translate(-50%, 18px)
                scale(.97);

            pointer-events: none;

            transition:
                opacity .2s ease,
                visibility .2s ease,
                transform .2s ease;

            z-index: 300;
        }

        .build-menu.open {
            opacity: 1;
            visibility: visible;

            transform:
                translate(-50%, 0)
                scale(1);

            pointer-events: auto;
        }

        .build-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 12px;
        }

        .build-title {
            color: #fff;

            font-size: 15px;

            font-weight: 900;
        }

        .build-subtitle {
            margin-top: 3px;

            color:
                rgba(255,255,255,.42);

            font-size: 10px;

            font-weight: 700;
        }

        .close-btn {
            width: 34px;
            height: 34px;

            border-radius: 10px;

            background:
                rgba(255,255,255,.06);

            color:
                rgba(255,255,255,.75);

            cursor: pointer;
        }

        .close-btn:active {
            transform: scale(.94);
        }

        .build-grid {
            display: grid;

            grid-template-columns:
                repeat(6, minmax(0, 1fr));

            gap: 8px;

            max-height: 270px;

            overflow-y: auto;

            scrollbar-width: thin;
        }

        .build-item {
            min-height: 88px;

            padding: 9px 7px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 4px;

            border-radius: 14px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid rgba(255,255,255,.055);

            color: #fff;

            cursor: pointer;

            transition:
                transform .15s ease,
                background .15s ease,
                border-color .15s ease;
        }

        .build-item:hover {
            background:
                rgba(255,255,255,.075);
        }

        .build-item:active {
            transform: scale(.95);
        }

        .build-item.selected {
            background:
                rgba(255,255,255,.12);

            border-color:
                rgba(255,255,255,.24);

            box-shadow:
                0 0 0 1px
                rgba(255,255,255,.04)
                inset;
        }

        .build-item .icon {
            font-size: 25px;

            line-height: 1;
        }

        .build-item .name {
            max-width: 100%;

            color:
                rgba(255,255,255,.78);

            font-size: 9px;

            line-height: 1.15;

            font-weight: 800;

            text-align: center;
        }

        .build-item .price {
            color:
                rgba(255,255,255,.38);

            font-size: 8px;

            font-weight: 700;
        }

        /* =========================================================
           BUILDING PANEL
        ========================================================= */

        .building-panel {
            position: fixed;

            top: 92px;
            right: 14px;

            width: 300px;

            padding: 16px;

            background:
                rgba(7,12,18,.96);

            border:
                1px solid rgba(255,255,255,.09);

            border-radius: 20px;

            box-shadow:
                0 25px 70px rgba(0,0,0,.38);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            opacity: 0;
            visibility: hidden;

            transform:
                translateX(20px);

            pointer-events: none;

            transition:
                opacity .22s ease,
                visibility .22s ease,
                transform .22s ease;

            z-index: 350;
        }

        .building-panel.open {
            opacity: 1;
            visibility: visible;

            transform:
                translateX(0);

            pointer-events: auto;
        }

        .panel-header {
            display: flex;
            align-items: center;

            gap: 11px;

            margin-bottom: 15px;
        }

        .building-icon {
            width: 48px;
            height: 48px;

            display: grid;
            place-items: center;

            border-radius: 14px;

            background:
                rgba(255,255,255,.065);

            font-size: 25px;
        }

        .building-heading {
            min-width: 0;
            flex: 1;
        }

        #buildingName {
            color: #fff;

            font-size: 15px;

            font-weight: 900;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #buildingType {
            margin-top: 3px;

            color:
                rgba(255,255,255,.40);

            font-size: 9px;

            font-weight: 700;
        }

        .panel-level {
            margin-bottom: 13px;

            padding: 10px 12px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.04);

            color:
                rgba(255,255,255,.55);

            font-size: 11px;

            font-weight: 700;
        }

        .panel-level strong {
            color: #fff;
        }

        .panel-stats {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 7px;

            margin-bottom: 13px;
        }

        .panel-stat {
            padding: 10px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.04);

            border:
                1px solid rgba(255,255,255,.04);
        }

        .panel-stat small {
            display: block;

            margin-bottom: 4px;

            color:
                rgba(255,255,255,.38);

            font-size: 8px;

            font-weight: 800;
        }

        .panel-stat strong {
            color: #fff;

            font-size: 13px;

            font-weight: 900;
        }

        .panel-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;
        }

        .panel-action {
            min-height: 42px;

            border-radius: 12px;

            color: #fff;

            font-size: 11px;

            font-weight: 900;

            cursor: pointer;
        }

        #upgradeBuilding {
            background:
                rgba(93,145,255,.18);

            border:
                1px solid rgba(93,145,255,.20);
        }

        #demolishBuilding {
            background:
                rgba(220,80,80,.14);

            border:
                1px solid rgba(220,80,80,.18);
        }

        .panel-action:active {
            transform: scale(.97);
        }

        /* =========================================================
           CAMERA CONTROLS
        ========================================================= */

        .camera-controls {
            position: fixed;

            right: 14px;
            bottom: 88px;

            display: flex;
            flex-direction: column;

            gap: 8px;

            z-index: 180;
        }

        .camera-btn {
            width: 48px;
            height: 48px;

            display: grid;
            place-items: center;

            border-radius: 15px;

            background:
                rgba(7,12,18,.94);

            border:
                1px solid rgba(255,255,255,.08);

            color: #fff;

            font-size: 23px;

            cursor: pointer;

            box-shadow:
                0 10px 30px rgba(0,0,0,.22);

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);
        }

        .camera-btn:active {
            transform: scale(.92);
        }

        /* =========================================================
           SPEED
        ========================================================= */

        .speed-control {
            position: fixed;

            left: 14px;
            bottom: 88px;

            display: flex;
            align-items: center;

            gap: 3px;

            padding: 5px;

            border-radius: 16px;

            background:
                rgba(7,12,18,.94);

            border:
                1px solid rgba(255,255,255,.08);

            box-shadow:
                0 10px 30px rgba(0,0,0,.22);

            z-index: 180;
        }

        .speed-btn {
            min-width: 46px;
            height: 40px;

            padding: 0 10px;

            border-radius: 11px;

            background: transparent;

            color:
                rgba(255,255,255,.50);

            font-size: 12px;

            font-weight: 900;

            cursor: pointer;
        }

        .speed-btn.active {
            background:
                rgba(255,255,255,.10);

            color: #fff;
        }

        .speed-btn:active {
            transform: scale(.94);
        }

        /* =========================================================
           BOTTOM TOOLBAR
        ========================================================= */

        .toolbar {
            position: fixed;

            left: 50%;
            bottom: max(10px, env(safe-area-inset-bottom));

            transform:
                translateX(-50%);

            width:
                min(760px, calc(100vw - 20px));

            min-height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-around;

            padding: 6px;

            background:
                rgba(7,12,18,.96);

            border:
                1px solid rgba(255,255,255,.08);

            border-radius: 20px;

            box-shadow:
                0 20px 70px rgba(0,0,0,.38);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            z-index: 200;
        }

        .tool {
            flex: 1;

            max-width: 120px;

            height: 56px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 3px;

            border-radius: 15px;

            background: transparent;

            color: #fff;

            cursor: pointer;

            transition:
                background .15s ease,
                transform .15s ease;
        }

        .tool:hover {
            background:
                rgba(255,255,255,.055);
        }

        .tool.active {
            background:
                rgba(255,255,255,.10);
        }

        .tool:active {
            transform: scale(.94);
        }

        .tool-icon {
            font-size: 22px;

            line-height: 1;
        }

        .tool-label {
            color:
                rgba(255,255,255,.50);

            font-size: 8px;

            line-height: 1;

            font-weight: 900;

            letter-spacing: .5px;
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 900px) {

            .build-grid {
                grid-template-columns:
                    repeat(5, minmax(0, 1fr));
            }

        }

        @media (max-width: 600px) {

            .topbar {
                height: 66px;

                padding:
                    max(7px, env(safe-area-inset-top))
                    9px
                    8px
                    9px;

                gap: 8px;
            }

            .logo {
                min-width: 92px;

                font-size: 16px;
            }

            .logo span {
                margin-top: 5px;

                font-size: 7px;

                letter-spacing: 1.5px;
            }

            .stat {
                min-width: 96px;

                padding:
                    7px 9px;

                border-radius: 13px;
            }

            .stat small {
                font-size: 8px;
            }

            .stat strong {
                font-size: 12px;
            }

            .tool-indicator {
                top: 76px;
                left: 9px;
            }

            .notification {
                top: 76px;
                right: 9px;

                width:
                    calc(100vw - 18px);
            }

            .build-menu {
                bottom: 79px;

                width:
                    calc(100vw - 14px);

                padding: 12px;

                border-radius: 18px;
            }

            .build-grid {
                grid-template-columns:
                    repeat(4, 1fr);

                gap: 6px;

                max-height: 245px;
            }

            .build-item {
                min-height: 68px;

                padding: 6px;
            }

            .build-item .icon {
                font-size: 21px;
            }

            .build-item .name {
                font-size: 8px;
            }

            .build-item .price {
                display: none;
            }

            .building-panel {
                top: auto;

                left: 8px;
                right: 8px;

                bottom: 78px;

                width: auto;

                transform:
                    translateY(22px);
            }

            .building-panel.open {
                transform:
                    translateY(0);
            }

            .camera-controls {
                right: 9px;
                bottom: 80px;
            }

            .camera-btn {
                width: 42px;
                height: 42px;

                border-radius: 13px;
            }

            .speed-control {
                left: 9px;
                bottom: 80px;
            }

            .speed-btn {
                min-width: 36px;

                height: 38px;

                padding: 0 7px;
            }

            .toolbar {
                width:
                    calc(100vw - 12px);

                min-height: 64px;

                bottom:
                    max(6px, env(safe-area-inset-bottom));

                border-radius: 18px;
            }

            .tool {
                height: 52px;
            }

            .tool-icon {
                font-size: 20px;
            }

            .tool-label {
                font-size: 7px;
            }

        }

        @media (max-width: 380px) {

            .logo {
                min-width: 78px;

                font-size: 14px;
            }

            .logo span {
                font-size: 6px;
            }

            .stat {
                min-width: 86px;
            }

            .stat strong {
                font-size: 11px;
            }

            .tool-label {
                font-size: 6px;
            }

        }

        /* =========================================================
           LANDSCAPE MOBILE
        ========================================================= */

        @media (
            max-height: 500px
        ) and (
            orientation: landscape
        ) {

            .topbar {
                height: 58px;
            }

            .build-menu {
                bottom: 67px;

                max-height: 75vh;
            }

            .building-panel {
                top: 66px;

                bottom: auto;
            }

            .camera-controls,
            .speed-control {
                bottom: 67px;
            }

            .toolbar {
                height: 56px;

                min-height: 56px;
            }

            .tool {
                height: 46px;
            }

        }

    </style>
</head>

<body>

    <!-- =========================================================
         GAME CANVAS
    ========================================================== -->

    <canvas
        id="game"
        aria-label="MetroCity game world"
    ></canvas>


    <!-- =========================================================
         TOP HUD
    ========================================================== -->

    <header class="topbar">

        <div class="logo">
            METROCITY

            <span>
                CITY SIMULATOR • V5
            </span>
        </div>


        <div class="stats">

            <div class="stat">
                <small>💰 MONEY</small>
                <strong id="money">$125,000</strong>
            </div>


            <div class="stat">
                <small>👥 POPULATION</small>
                <strong id="population">1,250</strong>
            </div>


            <div class="stat">
                <small>😊 HAPPINESS</small>
                <strong id="happiness">82%</strong>
            </div>


            <div class="stat">
                <small>⚡ POWER</small>
                <strong id="power">100%</strong>
            </div>

        </div>

    </header>


    <!-- =========================================================
         TOOL INDICATOR
    ========================================================== -->

    <div
        id="toolIndicator"
        class="tool-indicator"
    >
        Tool: Select
    </div>


    <!-- =========================================================
         NOTIFICATION
    ========================================================== -->

    <div
        id="notification"
        class="notification"
        role="status"
        aria-live="polite"
    >

        <strong id="notificationTitle">
            MetroCity
        </strong>

        <div id="notificationText"></div>

    </div>


    <!-- =========================================================
         BUILD MENU
    ========================================================== -->

    <section
        id="buildMenu"
        class="build-menu"
        aria-label="Build menu"
    >

        <div class="build-header">

            <div>
                <div class="build-title">
                    Build
                </div>

                <div class="build-subtitle">
                    Select infrastructure to place
                </div>
            </div>


            <button
                id="closeBuild"
                class="close-btn"
                type="button"
                aria-label="Close build menu"
            >
                ✕
            </button>

        </div>


        <div class="build-grid">

            <button
                class="build-item"
                data-tool="road"
                type="button"
            >
                <span class="icon">🛣️</span>
                <span class="name">Road</span>
                <span class="price">Build road</span>
            </button>


            <button
                class="build-item"
                data-tool="house"
                type="button"
            >
                <span class="icon">🏠</span>
                <span class="name">Residential</span>
                <span class="price">$100</span>
            </button>


            <button
                class="build-item"
                data-tool="commercial"
                type="button"
            >
                <span class="icon">🏢</span>
                <span class="name">Commercial</span>
                <span class="price">$250</span>
            </button>


            <button
                class="build-item"
                data-tool="industrial"
                type="button"
            >
                <span class="icon">🏭</span>
                <span class="name">Industrial</span>
                <span class="price">$350</span>
            </button>


            <button
                class="build-item"
                data-tool="hospital"
                type="button"
            >
                <span class="icon">🏥</span>
                <span class="name">Hospital</span>
                <span class="price">$5,000</span>
            </button>


            <button
                class="build-item"
                data-tool="police"
                type="button"
            >
                <span class="icon">🚓</span>
                <span class="name">Police</span>
                <span class="price">$3,500</span>
            </button>


            <button
                class="build-item"
                data-tool="fire"
                type="button"
            >
                <span class="icon">🚒</span>
                <span class="name">Fire Station</span>
                <span class="price">$3,000</span>
            </button>


            <button
                class="build-item"
                data-tool="school"
                type="button"
            >
                <span class="icon">🏫</span>
                <span class="name">School</span>
                <span class="price">$4,000</span>
            </button>


            <button
                class="build-item"
                data-tool="park"
                type="button"
            >
                <span class="icon">🌳</span>
                <span class="name">Park</span>
                <span class="price">$500</span>
            </button>


            <button
                class="build-item"
                data-tool="power"
                type="button"
            >
                <span class="icon">⚡</span>
                <span class="name">Power Plant</span>
                <span class="price">$2,000</span>
            </button>


            <button
                class="build-item"
                data-tool="water"
                type="button"
            >
                <span class="icon">💧</span>
                <span class="name">Water Plant</span>
                <span class="price">$1,500</span>
            </button>


            <button
                class="build-item"
                data-tool="stadium"
                type="button"
            >
                <span class="icon">🏟️</span>
                <span class="name">Stadium</span>
                <span class="price">$12,000</span>
            </button>

        </div>

    </section>


    <!-- =========================================================
         BUILDING DETAILS PANEL
    ========================================================== -->

    <aside
        id="buildingPanel"
        class="building-panel"
        aria-label="Building details"
    >

        <div class="panel-header">

            <div
                id="buildingIcon"
                class="building-icon"
            >
                🏢
            </div>


            <div class="building-heading">

                <div id="buildingName">
                    Building
                </div>

                <div id="buildingType">
                    City Infrastructure
                </div>

            </div>


            <button
                id="closePanel"
                class="close-btn"
                type="button"
                aria-label="Close building panel"
            >
                ✕
            </button>

        </div>


        <div
            id="buildingLevel"
            class="panel-level"
        >
            Level <strong>1</strong>
        </div>


        <div class="panel-stats">

            <div class="panel-stat">
                <small>POPULATION</small>
                <strong id="panelPopulation">0</strong>
            </div>


            <div class="panel-stat">
                <small>WORKERS</small>
                <strong id="panelWorkers">0</strong>
            </div>


            <div class="panel-stat">
                <small>HAPPINESS</small>
                <strong id="panelHappiness">+0</strong>
            </div>


            <div class="panel-stat">
                <small>SERVICE</small>
                <strong id="panelService">—</strong>
            </div>

        </div>


        <div class="panel-actions">

            <button
                id="upgradeBuilding"
                class="panel-action"
                type="button"
            >
                ⬆ Upgrade
            </button>


            <button
                id="demolishBuilding"
                class="panel-action"
                type="button"
            >
                🗑 Demolish
            </button>

        </div>

    </aside>


    <!-- =========================================================
         CAMERA CONTROLS
    ========================================================== -->

    <div
        class="camera-controls"
        aria-label="Camera controls"
    >

        <button
            id="zoomIn"
            class="camera-btn"
            type="button"
            aria-label="Zoom in"
        >
            +
        </button>


        <button
            id="resetCamera"
            class="camera-btn"
            type="button"
            aria-label="Reset camera"
        >
            ◎
        </button>


        <button
            id="zoomOut"
            class="camera-btn"
            type="button"
            aria-label="Zoom out"
        >
            −
        </button>

    </div>


    <!-- =========================================================
         SIMULATION SPEED
    ========================================================== -->

    <div
        class="speed-control"
        aria-label="Simulation speed"
    >

        <button
            class="speed-btn active"
            data-speed="1"
            type="button"
        >
            1×
        </button>


        <button
            class="speed-btn"
            data-speed="2"
            type="button"
        >
            2×
        </button>


        <button
            class="speed-btn"
            data-speed="4"
            type="button"
        >
            4×
        </button>


        <button
            class="speed-btn"
            data-speed="8"
            type="button"
        >
            8×
        </button>

    </div>


    <!-- =========================================================
         BOTTOM TOOLBAR
    ========================================================== -->

    <nav
        class="toolbar"
        aria-label="Main navigation"
    >

        <button
            class="tool active"
            id="buildButton"
            type="button"
        >

            <span class="tool-icon">
                🏗️
            </span>

            <span class="tool-label">
                BUILD
            </span>

        </button>


        <button
            class="tool"
            id="mapButton"
            type="button"
        >

            <span class="tool-icon">
                🗺️
            </span>

            <span class="tool-label">
                MAP
            </span>

        </button>


        <button
            class="tool"
            id="cityButton"
            type="button"
        >

            <span class="tool-icon">
                🏙️
            </span>

            <span class="tool-label">
                CITY
            </span>

        </button>


        <button
            class="tool"
            id="statsButton"
            type="button"
        >

            <span class="tool-icon">
                📊
            </span>

            <span class="tool-label">
                STATS
            </span>

        </button>


        <button
            class="tool"
            id="settingsButton"
            type="button"
        >

            <span class="tool-icon">
                ⚙️
            </span>

            <span class="tool-label">
                SETTINGS
            </span>

        </button>

    </nav>


    <!-- =========================================================
         MAIN GAME ENTRY
         
         IMPORTANT:
         There must NOT be another <script> block wrapping this.
    ========================================================== -->

    <script
        type="module"
        src="./main.js"
    ></script>

</body>
</html>
